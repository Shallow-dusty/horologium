[workspace]
resolver = "2"
members = ["crates/horologium-core", "crates/horologium-cli"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Shallow-dusty/horologium"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
owo-colors = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"

# Release profile must live at the workspace root.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
